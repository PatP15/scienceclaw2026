; FermentAI — USB-serial transport build profiles (docs/SERIAL_TRANSPORT.md).
;
; Kept in a separate file so platformio.ini is not modified. It pulls the normal envs in via
; extra_configs, so the serial envs inherit everything from esp32s3cam_a / esp32s3cam_b:
;
;   pio run  -c platformio_serial.ini -e esp32s3cam_a_serial
;   pio run  -c platformio_serial.ini -e esp32s3cam_b_serial
;   pio run  -c platformio_serial.ini -e esp32s3cam_a_serial -t upload
;
; FERMENTAI_TRANSPORT_SERIAL=1 only takes effect once the main.cpp hook in
; docs/SERIAL_TRANSPORT.md §6 is applied. Without the hook these envs build the normal Wi-Fi
; firmware (SerialTransport is compiled but unused).
;
; CORE_DEBUG_LEVEL=0 silences ESP-IDF/Arduino log_x() output, which would otherwise share the
; serial port with the JSON lines. CAMERA_ENABLED=0 because images are not carried over serial_v1.

[platformio]
extra_configs = platformio.ini
default_envs = esp32s3cam_a_serial

[serial_overrides]
build_unflags =
    -DCORE_DEBUG_LEVEL=2
    -DCAMERA_ENABLED=1
build_flags =
    -DFERMENTAI_TRANSPORT_SERIAL=1
    -DCORE_DEBUG_LEVEL=0
    -DCAMERA_ENABLED=0

[env:esp32s3cam_a_serial]
extends = env:esp32s3cam_a
build_unflags =
    ${esp32s3_base.build_unflags}
    ${serial_overrides.build_unflags}
build_flags =
    ${env:esp32s3cam_a.build_flags}
    ${serial_overrides.build_flags}

[env:esp32s3cam_b_serial]
extends = env:esp32s3cam_b
build_unflags =
    ${esp32s3_base.build_unflags}
    ${serial_overrides.build_unflags}
build_flags =
    ${env:esp32s3cam_b.build_flags}
    ${serial_overrides.build_flags}
