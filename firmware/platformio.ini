; FermentAI chamber firmware — PlatformIO project
;
; One firmware image for both chambers; the per-device differences are build flags.
;   pio run -e esp32s3cam_a          # chamber A hardware build
;   pio run -e esp32s3cam_b          # chamber B hardware build
;   pio run -e esp32s3cam_noio       # real ESP32-S3, NO sensor/actuator I/O: mock drivers, source=simulated
;   pio test -e native               # host unit tests (Unity), no hardware
;
; High-power outputs (Peltier) are compiled OUT unless FERMENTAI_ALLOW_PELTIER_OUTPUT=1 AND the
; runtime NVS arm flag is set from the serial console during commissioning (docs/BRINGUP.md).
; The motor additionally needs the runtime NVS arm flag. Both default to DISARMED.
;
; Board: there is no PlatformIO board definition for the Aideepen/Freenove-style ESP32-S3-CAM in
; espressif32@6.9.0, so the ESP32-S3-DevKitC-1 definition is used with OPI-PSRAM overrides for an
; ESP32-S3-WROOM-1 N8R8/N16R8 module. Flash size is declared as 8 MB (works on 16 MB parts).
; VERIFY the exact module marking on your board (docs/HARDWARE_UNCERTAINTIES.md).

[platformio]
default_envs = esp32s3cam_a

[common]
lib_deps_core =
    bblanchon/ArduinoJson@7.2.1

lib_deps_hw =
    ${common.lib_deps_core}
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
    adafruit/Adafruit Unified Sensor@1.1.14
    adafruit/Adafruit BusIO@1.16.1
    adafruit/Adafruit BME680 Library@2.0.4
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit AHTX0@2.0.6

; Contract profile: FERMENTAI_CONTRACT_V11=1 emits the v1.1 superset (v1.0 fields + v1.1 fields);
; set it to 0 to talk to a strict v1.0-only backend (extra="forbid"). See include/telemetry_schema.h.
build_flags_common =
    -std=gnu++17
    -Wall
    -DFERMENTAI_FIRMWARE_VERSION=\"0.3.0\"
    -DFERMENTAI_CONTRACT_V11=1

[esp32s3_base]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags_common}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
lib_deps = ${common.lib_deps_hw}
build_src_filter = +<*>

; ---------------------------------------------------------------- chamber A (has the only pH probe)
[env:esp32s3cam_a]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DCHAMBER_ID=\"A\"
    -DDEVICE_ID=\"fermentai-esp32-a\"
    -DENV_SENSOR=ENV_SENSOR_ENS160_AHT21
    -DPH_SENSOR_ENABLED=1
    -DCAMERA_ENABLED=1
    -DMOTOR_ENABLED=1
    -DFERMENTAI_NOIO=0
    -DFERMENTAI_ALLOW_PELTIER_OUTPUT=0

; ---------------------------------------------------------------- chamber B (no pH probe)
[env:esp32s3cam_b]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DCHAMBER_ID=\"B\"
    -DDEVICE_ID=\"fermentai-esp32-b\"
    -DENV_SENSOR=ENV_SENSOR_BME680
    -DPH_SENSOR_ENABLED=0
    -DCAMERA_ENABLED=1
    -DMOTOR_ENABLED=1
    -DFERMENTAI_NOIO=0
    -DFERMENTAI_ALLOW_PELTIER_OUTPUT=0

; ---------------------------------------------------------------- real ESP32-S3, mock I/O
; No GPIO is touched except UART/USB and Wi-Fi. All sensor values come from a first-order thermal
; test plant and are labelled source="simulated" + field_provenance=simulated. NOT a physical model.
[env:esp32s3cam_noio]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -DCHAMBER_ID=\"A\"
    -DDEVICE_ID=\"fermentai-esp32-a\"
    -DENV_SENSOR=ENV_SENSOR_BME680
    -DPH_SENSOR_ENABLED=0
    -DCAMERA_ENABLED=0
    -DMOTOR_ENABLED=1
    -DFERMENTAI_NOIO=1
    -DFERMENTAI_ALLOW_PELTIER_OUTPUT=0

; ---------------------------------------------------------------- host unit tests
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
lib_deps = ${common.lib_deps_core}
build_flags =
    ${common.build_flags_common}
    -Isrc
    -DUNIT_TEST
    -DFERMENTAI_NATIVE=1
    -DFERMENTAI_NOIO=1
    -DCHAMBER_ID=\"A\"
    -DDEVICE_ID=\"fermentai-esp32-a\"
    -DPH_SENSOR_ENABLED=1
    -DCAMERA_ENABLED=0
    -DMOTOR_ENABLED=1
    '-DFERMENTAI_CONTRACT_DIR="$PROJECT_DIR/../firmware_contract"'
    '-DFERMENTAI_CONTRACTS_V11_DIR="$PROJECT_DIR/../contracts"'
    '-DFERMENTAI_SAMPLES_DIR="$PROJECT_DIR/build_logs/contract_samples"'
