# Hackathon print job: six parts on Form 4 / Grey V5 / 0.1 mm.
# Run:  uv run python scripts/prepare_print.py prepare --job data/stl/print/jobs/hackathon_six.yaml
# Parts are placed in list (priority) order; copies that do not fit move to the next build.
# Nothing is ever scaled; nothing is ever sent to a printer.
name: hackathon
profile: form4-grey-v5
spacing_mm: 5
parts:
  - chamber: A                       # hash + validation from data/stl/chain_summary.json
    label: "mild, 22 °C"             # orientation open_face_up (crumb face up), strict import
  - chamber: B
    label: "sour, 27 °C"
  - name: hat
    stl: data/stl/external/hat.stl   # user-supplied (~/Downloads/hat.stl), copied unchanged
    count: 2
    orientation: preform_auto        # PreForm auto-orient + auto-supports
    repair: error_then_repair        # strict import first; PreForm repair only if it refuses
    label: "chef hat, user-supplied"
    provenance: imported_human
  - name: clawd
    stl: data/stl/external/clawd.stl # user-supplied (~/Downloads/clawd.stl), copied unchanged
    count: 2
    orientation: preform_auto
    repair: error_then_repair
    label: "Clawd figure, user-supplied"
    provenance: imported_human
