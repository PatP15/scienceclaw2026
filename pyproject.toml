[project]
name = "fermentai"
version = "0.1.0"
description = "FermentAI: decentralized AI scientist agents for sourdough fermentation (ScienceClaw 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "trimesh>=4.3",
    "manifold3d>=2.4",
    "rtree>=1.2",
    "pillow>=10.3",
    "scikit-image>=0.23",
    "rdkit>=2024.3",
    "ase>=3.23",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Installed only on the remote Brev GPU instance, never required on the Mac.
remote = ["torch", "nvalchemi-toolkit"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fermentai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
